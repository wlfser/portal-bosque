<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Universidad El Bosque – Portal Académico</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="login-page">

  <div class="bg-pattern"></div>

  <div class="login-container">
    <div class="login-brand">
      <div class="logo-circle">UB</div>
      <h1>Universidad El Bosque</h1>
      <p>Portal Académico de Guías y Laboratorios</p>
    </div>

    <div class="role-selector">
      <button class="role-btn active" data-role="student" onclick="switchRole('student')">
        <span class="role-icon">🎓</span>
        <span>Estudiante</span>
      </button>
      <button class="role-btn" data-role="admin" onclick="switchRole('admin')">
        <span class="role-icon">👨‍🏫</span>
        <span>Profesor</span>
      </button>
    </div>

    <form class="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label id="user-label">Código Estudiantil</label>
        <input type="text" id="username" placeholder="Ej: 20231234" required />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <div id="login-error" class="login-error" style="display:none">
        ❌ Usuario o contraseña incorrectos
      </div>
      <button type="submit" class="btn-login">Ingresar al Portal</button>
    </form>

    <p class="login-footer">Universidad El Bosque © 2025 · Bogotá, Colombia</p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
